name: Backend checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests experiments/03_backend_smoke/run.py experiments/04_api_walkthrough/run.py experiments/05_backend_evaluation tools/task03_check.py tools/pipeline_smoke.py datasets/task03/build.py
      - run: pytest tests experiments/02_model_comparison/test_scoring.py experiments/01_baseline/test_checks.py
      - run: python tools/task03_check.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json
      - run: npm ci
        working-directory: apps/panel
      - run: npm run build
        working-directory: apps/panel
      - run: npm run test:audio
        working-directory: apps/panel
